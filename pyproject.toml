[project]
name = "crypto-assignment"
version = "0.3.1"
description = "A web application for encrypting and decrypting text using various encryption algorithms."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sarthak Patil", email = "mail@sarthak.co.in" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Framework :: Flask"
]
dependencies = [
    "Flask>=3.1.1",
    "gunicorn>=23.0.0",
    "retro-ciphers>=1.0.0"
]
[dependency-groups]
dev = [
    "ruff>=0.15.7",
]
